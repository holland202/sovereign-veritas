name: eo1
on:
  push:
  pull_request:
jobs:
  eo1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: EO-1 probe reproduces the recorded outcome
        run: python tools/eo1_probe.py
      - name: EO-1 sabotage (effect counter reads 0) must exit 1
        run: |
          if python tools/eo1_probe.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
