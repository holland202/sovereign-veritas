name: SEC-006 lock stress (registered)

on:
  push:
    branches: [main, security/sec-006-stress]
    paths:
      - "sovereign_veritas/idempotency.py"
      - "tools/sec006_stress_probe.py"
      - ".github/workflows/sec006-stress.yml"
  pull_request:
    paths:
      - "sovereign_veritas/idempotency.py"
      - "tools/sec006_stress_probe.py"
      - ".github/workflows/sec006-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sec006:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Registered run (must report NO_VIOLATION_IN_TESTED_SCHEDULES)
        shell: bash
        run: python -I tools/sec006_stress_probe.py | tee sec006-run.txt
      - name: Sabotage (lock removed) must exit 1
        shell: bash
        run: |
          set +e
          python -I tools/sec006_stress_probe.py --sabotage > sec006-sabotage.txt 2>&1
          rc=$?
          set -e
          grep -E "^(LOCK|NOLOCK|P[0-9]|VERDICT)" sec006-sabotage.txt
          test "$rc" = "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sec006-${{ matrix.os }}
          path: sec006-*.txt
