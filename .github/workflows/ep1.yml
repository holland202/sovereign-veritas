name: ep1
on:
  push:
  pull_request:
jobs:
  ep1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: EP-1 probe reproduces the recorded outcome
        run: python tools/ep1_probe.py
      - name: EP-1 sabotage must exit 1
        run: |
          if python tools/ep1_probe.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
