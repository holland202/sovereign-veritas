name: g1-4-drain
on:
  push:
  pull_request:
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: drain probe reproduces the recorded outcome
        run: python tools/g1_4_drain_probe.py
      - name: drain probe sabotage must exit 1
        run: |
          if python tools/g1_4_drain_probe.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
