name: fault-injection
on:
  push:
  pull_request:
jobs:
  fi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: FI harness reproduces the recorded outcome (exit 0 only on RECORDED)
        run: python tools/fault_injection.py
      - name: FI sabotage must exit 1
        run: |
          if python tools/fault_injection.py --sabotage > /dev/null; then echo "sabotage passed: instrument is vacuous"; exit 1; fi
      - name: F3 probe reproduces the recorded outcome
        run: python tools/fi_f3_probe.py
      - name: F3 probe sabotage must exit 1
        run: |
          if python tools/fi_f3_probe.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
