name: g1-recount
on:
  push:
  pull_request:
jobs:
  recount:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: G1 recount reproduces the recorded outcome
        run: python tools/g1_recount.py
      - name: G1 recount anti-vacuity (stub rules flip every NOT BUILT test)
        run: python tools/g1_recount.py --selftest
      - name: G1 recount sabotage must exit 1
        run: |
          if python tools/g1_recount.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
