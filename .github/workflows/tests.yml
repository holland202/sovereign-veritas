# Runs on GitHub's machines: the first measurements of this repo on macOS and Windows.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # GitHub runs bash with -eo pipefail: a failing command before a pipe fails the step
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Gate decisions identical to the S25 (4608-case digest)
        run: |
          python tools/gate_constraint.py --target . | tee gate.txt
          grep -q "DIGEST    ab816905b1faf69aeaf24119b207cf7b80fcebd2ffcddac80d3edfa5e4da2d65" gate.txt
      - name: Gate contract - kernel and verifier match all vectors, same digest everywhere (CONTRACT.md)
        run: |
          python tools/gate_contract.py --check kernel
          python tools/gate_contract.py --check verifier
      - name: Make a package and verify it independently
        run: |
          f=$(python tools/make_package.py --thermal-status normal | awk '/^package /{print $2}')
          python tools/verify_package.py "$f"
      - name: Make a measured-thermal package and verify it (no S25 zones here, so REFUSE is expected)
        run: |
          python tools/make_package.py --thermal-status measured | tee measured.txt
          f=$(awk '/^package /{print $2}' measured.txt)
          python tools/verify_package.py "$f"
      - name: V14 corridor - registered outcome reproduced on every platform (docs/V14_CORRIDOR_RESULTS.md)
        run: python tools/corridor_challenge.py | tail -4
      - name: V15 recovery admissibility - registered outcome reproduced (docs/V15_RECOVERY_RESULTS.md)
        run: python tools/recovery_admissibility.py | tail -3

  port-go:
    # C6 (docs/GATE_CONTRACT.md): the Go port of sv.gate/0 must reproduce the conformance digest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build -o ../../svgate .
        working-directory: ports/go  # the Go module lives there, not at the repository root
      - run: python tools/gate_contract.py --check-command ./svgate

  red-team:
    # Checks that the checks can fail (docs/INTEGRATION.md, I1 and I3). One runner is enough: these
    # test the verifier's and the Gate's own guards, not the platform.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pymavlink
      # pymavlink so test_vehicle_action runs in full: a mutant that passes while tests are
      # skipped is UNDECIDED, so SURVIVED is only reachable when nothing is skipped here.
      - name: Every verifier guard, switched off in turn, must fail a test (method from EACE)
        run: python tools/verifier_mutants.py
      - name: Every planted Gate bug must be caught
        run: python tools/gate_constraint.py --target . --mutants
      - name: Every reachable rule of the Gate is pinned by a contract vector
        run: python tools/gate_contract.py --mutants
      - name: XB-1 execution boundary - refuse-before-effect fix reaches X1-X3 only, X4/X5 stay open (docs/EXECUTION_BOUNDARY_RESULTS.md)
        run: python tools/execution_boundary_probe.py --expect-fix
      - name: RK-2 reserved idempotency key - 10/10 as registered (docs/RK2_RESULTS.md)
        run: python tools/rk2_probe.py | tail -3
      - name: RK-2 probe can fail (--sabotage non-atomic store -> exit 1)
        run: |
          set +e; python tools/rk2_probe.py --sabotage > rk2_sab.txt; rc=$?; set -e
          tail -3 rk2_sab.txt
          test "$rc" -eq 1 || { echo "expected exit 1 from --sabotage, got $rc"; exit 1; }
      - name: XB-2 durable-once boundary - 35/35 cells as registered (docs/XB2_RESULTS.md)
        run: python tools/xb2_boundary_probe.py
      - name: XB-2 probe can fail (A4 external stops cooperating -> exit 1)
        run: |
          set +e; python tools/xb2_boundary_probe.py --sabotage > xb2_sab.txt; rc=$?; set -e
          tail -3 xb2_sab.txt
          test "$rc" -eq 1 || { echo "expected exit 1 from --sabotage, got $rc"; exit 1; }
      - name: V14 corridor can fail (--sabotage never executes the monitor's LAND -> exit 1)
        run: |
          set +e; python tools/corridor_challenge.py --sabotage > v14_sab.txt; rc=$?; set -e
          tail -3 v14_sab.txt
          test "$rc" -eq 1 || { echo "expected exit 1 from --sabotage, got $rc"; exit 1; }
      - name: V14 challenger protocol - the example attacker reproduces A4 through a separate process
        run: |
          python tools/corridor_challenge.py --attacker "python tools/corridor_attacker_example.py" | tee v14_ext.txt
          grep -q "VERDICT  NO BREAK: max breach 30.9500 m" v14_ext.txt
      - name: V15 can fail (--sabotage removes P2's nonce check -> exit 1)
        run: |
          set +e; python tools/recovery_admissibility.py --sabotage > v15_sab.txt; rc=$?; set -e
          tail -3 v15_sab.txt
      - name: PX4/PX2 (Perplexity attacks 4, 2) - registered outcome reproduced (docs/PX_RESULTS.md)
        run: python tools/px_probe.py | tail -3
      - name: PX probe can fail (--sabotage -> exit 1)
        run: |
          set +e; python tools/px_probe.py --sabotage > px_sab.txt; rc=$?; set -e
          tail -3 px_sab.txt
          test "$rc" -eq 1 || { echo "expected exit 1 from --sabotage, got $rc"; exit 1; }
      - name: JG-1 (James Greenwood's five findings) - registered outcome reproduced (docs/JG1_PREREG.md)
        run: python tools/jg1_probe.py | tail -3
      - name: JG-1 probe can fail (--sabotage restores the pre-fix behaviour -> exit 1)
        run: |
          set +e; python tools/jg1_probe.py --sabotage > jg1_sab.txt; rc=$?; set -e
          tail -3 jg1_sab.txt
          test "$rc" -eq 1 || { echo "expected exit 1 from --sabotage, got $rc"; exit 1; }
      - name: JG-2 (report section 6 checked against the code) - registered outcome reproduced (docs/JG2_PREREG.md)
        run: python tools/jg2_probe.py | tail -4
      - name: JG-2 probe can fail (--sabotage skips the byte change -> exit 1)
        run: |
          set +e; python tools/jg2_probe.py --sabotage > jg2_sab.txt; rc=$?; set -e
          tail -3 jg2_sab.txt
          test "$rc" -eq 1 || { echo "expected exit 1 from --sabotage, got $rc"; exit 1; }
      - name: Fetch vacuity_lint, pinned
        run: |
          git clone -q https://github.com/holland202/vacuity_lint.py "$RUNNER_TEMP/vl"
          git -C "$RUNNER_TEMP/vl" checkout -q 68355bb
          python "$RUNNER_TEMP/vl/vacuity_lint.py" --selftest
      - name: The scan can fire (a planted file with no fail path must give exit 1, not 0 or 2)
        run: |
          printf 'import sys\nok = False\nprint("[FAIL] planted")\nprint("[PASS] ok")\nsys.exit(0)\n' > tools/verify_planted.py
          set +e; python "$RUNNER_TEMP/vl/vacuity_lint.py" . > planted.txt; rc=$?; set -e
          rm tools/verify_planted.py
          cat planted.txt
          test "$rc" -eq 1 || { echo "expected exit 1 with a planted defect, got $rc"; exit 1; }
      - name: No verification code in this repository without a fail path
        run: python "$RUNNER_TEMP/vl/vacuity_lint.py" .
